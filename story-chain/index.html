  <script>window.ESC_NEW_GAME={"slug":"story-chain","title":"Story Chain","eyebrow":"📚 GROUP STORY","type":"storyChain","desc":"Build one story together. The first player starts with the sentence on the card; each person adds one or two sentences and keeps the story connected.","rules":["1–2 sentences each","Keep previous details","No restarting","Aim for an ending"],"note":"If the story becomes confusing, the next player may briefly summarise what has happened before adding a new sentence.","items":[["Everyday","I opened my front door and found a small box with my name on it.","Start normally. By the third player, introduce one unexpected problem."],["Everyday","The bus stopped, but nobody knew where we were.","Each player adds one new detail about the place or passengers."],["Everyday","I realised I had taken the wrong bag from the café.","Keep the story realistic for at least three turns."],["Everyday","My phone rang, and the caller said, “Do not go home yet.”","Every player must add one reason the situation is becoming stranger."],["Travel","Our flight was cancelled, so we made a completely different plan.","Add one travel decision per turn."],["Travel","We arrived at the hotel, but the receptionist looked shocked to see us.","Explain why without contradicting earlier details."],["Travel","The map showed a road that did not exist.","Every player introduces one clue."],["Travel","At the train station, a stranger handed me a ticket and disappeared.","The ticket must become important later."],["Mystery","There was a key on the table, but nobody in the room knew what it opened.","Each person may add one clue, but no final answer until the last two turns."],["Mystery","Every clock in the building stopped at exactly 8:17.","Build one possible explanation together."],["Mystery","A photo on the wall changed when nobody was looking.","Keep the story suspenseful but understandable."],["Mystery","Someone in our group received a message from a number that did not exist.","Add clues; avoid solving it too early."],["Funny","The wedding cake disappeared ten minutes before the wedding.","Make the problem worse for three turns before solving it."],["Funny","I accidentally became the presenter of a live TV show.","Each player adds one new challenge."],["Funny","A dog walked into the meeting and everyone acted like it was normal.","Give the dog an important role in the story."],["Funny","The restaurant served us exactly the opposite of everything we ordered.","Keep adding ridiculous but connected mistakes."],["Future","In 2045, nobody was allowed to own a smartphone.","Explain how people communicate instead."],["Future","I woke up and my home had an AI assistant that knew too much about me.","Each player reveals one thing the AI knows."],["Future","The first tourist trip to Mars was cheaper than a flight to London.","Decide why and build the consequences."],["Future","My new job existed only inside virtual reality.","Describe the job as the story continues."],["Social","At dinner, two people realised they had met before but remembered the meeting very differently.","Each player adds one memory or clue."],["Social","A new person joined our friend group and seemed to know everyone already.","Explain connections one by one."],["Social","I sent one message to the wrong group chat and changed the whole evening.","Each player adds one consequence."],["Social","Nobody wanted to admit who had organised the surprise party.","Keep the reason hidden until later."],["Adventure","We found a door behind a bookshelf in an old café.","Every person adds one thing found beyond the door."],["Adventure","We had one hour to leave the city, but nobody told us why.","Build a clear reason by the end."],["Adventure","The boat stopped in the middle of the sea and the radio went silent.","Each turn must include one action the group takes."],["Adventure","We followed a street musician and ended up somewhere impossible.","Keep the story playful and visual."],["Challenge
