<section class="game-hero"><span class="game-eyebrow">⚖ Choice Game</span><h1>Would You Rather?</h1><p>Pick one. No “it depends.” Then explain why your choice is better.</p></section><nav class="game-chips" id="chips"></nav>
<main class="game-panel"><div class="game-meta"><span id="deckInfo">Ready</span><span id="catInfo">All categories</span></div><section class="game-card"><div class="game-card-inner"><span class="game-badge" id="badge">Everyday</span><div class="choice-grid"><button class="choice" id="choiceA"><span class="choice-letter">OPTION A</span><span class="choice-text" id="textA"></span></button><div class="versus">OR</div><button class="choice" id="choiceB"><span class="choice-letter">OPTION B</span><span class="choice-text" id="textB"></span></button></div><div class="why" id="why">Good. Now defend your choice: <strong>Why?</strong></div></div></section><div class="game-controls"><button class="game-secondary" id="back">↩ Previous</button><button class="game-primary" id="next">Next choice →</button><button class="game-secondary" id="shuffle">↻ Surprise me</button></div><div class="game-note">Keyboard: A / B to choose · Space for next</div></main></div><script src="../esc-game-kit.js?v=20260916-0802"></script><script>
const items=[
['Everyday','lose your phone for one month','lose your wallet for one week'],['Everyday','always be 20 minutes early','always be 10 minutes late'],['Everyday','give up coffee forever','give up desserts forever'],['Everyday','only use voice notes','only use phone calls'],['Everyday','live without air conditioning','live without hot water'],['Everyday','cook every meal yourself','eat restaurant food every day'],['Everyday','work four long days a week','work six short days a week'],['Everyday','have unlimited free travel','have unlimited free food'],['Everyday','never use social media again','never watch series again'],['Everyday','always have slow internet','always have 10% phone battery'],['Everyday','clean the whole house every day','do all the dishes forever'],['Everyday','wear the same shoes every day','wear the same jacket every day'],
['Funny','have a laugh like a car horn','sneeze like a cartoon character'],['Funny','fight one horse-sized duck','fight 100 duck-sized horses'],['Funny','speak only in rhymes','sing everything you say'],['Funny','have spaghetti for hair','have popcorn for teeth'],['Funny','be followed by dramatic music','have applause after every sentence'],['Funny','wear clown shoes for a year','wear a cape everywhere for a year'],['Funny','swap voices with your best friend','swap laughs with your boss'],['Funny','have a pet dinosaur','have a pet dragon'],['Funny','always smell like garlic','always sound slightly robotic'],['Funny','have to dance when you hear your name','have to clap when someone says “okay”'],['Funny','be famous for a meme','be famous for a terrible song'],['Funny','accidentally send every screenshot','accidentally send every draft message'],
['Deep','know exactly when you will die','know exactly how you will die'],['Deep','be deeply loved but not respected','be respected but not deeply loved'],['Deep','restart life at age 15 with your memories','jump 20 years into your future'],['Deep','erase your biggest regret','keep it and understand exactly why it happened'],['Deep','always know when someone lies','always know what someone really feels'],['Deep','have your dream career far from everyone you love','stay near everyone you love in an average job'],['Deep','be remembered by millions','be deeply remembered by ten people'],['Deep','have complete financial freedom','have complete control over your time'],['Deep','never feel fear again','never feel regret again'],['Deep','change one decision from your past','see one decision from your future'],['Deep','know every answer about your past','know one important answer about your future'],['Deep','live a peaceful predictable life','live an exciting uncertain life'],
['Impossible','read minds but never turn it off','see the future but never change it'],['Impossible','teleport anywhere once a day','stop time for ten minutes once a day'],['Impossible','speak every language','master every musical instrument'],['Impossible','live on the Moon for five years','live underwater for five years'],['Impossible','be invisible for one hour a day','fly for one hour a day'],['Impossible','never need sleep','never need money'],['Impossible','have one wish today','have three wishes in ten years'],['Impossible','meet your future self','meet your 10-year-old self'],['Impossible','download one new skill instantly','delete one bad habit instantly'],['Impossible','control the weather','control your dreams'],['Impossible','remember everything forever','forget anything on command'],['Impossible','live to 150 in perfect health','live a normal lifespan with unlimited money'],
['Spicy','date someone very attractive but unreliable','date someone average-looking but completely dependable'],['Spicy','text your ex right now','show the group your last DM'],['Spicy','have amazing chemistry with bad communication','have amazing communication with weak chemistry'],['Spicy','know everyone who has had a crush on you','know everyone your crush has liked'],['Spicy','go on a perfect date with no second date','go on an awkward date that becomes a great relationship'],['Spicy','be ghosted','be told directly “I am not interested”'],['Spicy','date someone jealous','date someone emotionally distant'],['Spicy','have your partner know your full dating history','know your partner’s full dating history'],['Spicy','kiss someone you just met','wait three months before a first kiss'],['Spicy','date your opposite','date someone almost exactly like you'],['Spicy','choose chemistry','choose stability'],['Spicy','receive a risky 2 a.m. text','send a risky 2 a.m. text']];
const cats=['All','Everyday','Funny','Deep','Impossible','Spicy'];let selected='All',deck=[],pos=-1,history=[];const $=id=>document.getElementById(id);const shuffle=a=>{a=[...a];for(let i=a.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]]}return a};
function build(){deck=shuffle(items.filter(x=>selected==='All'||x[0]===selected));pos=-1;$('deckInfo').textContent=deck.length+' choices';$('catInfo').textContent=selected==='All'?'All categories':selected}
function show(x,save=true){if(!x)return;$('badge').textContent=x[0];$('textA').textContent=x[1];$('textB').textContent=x[2];document.querySelectorAll('.choice').forEach(b=>b.classList.remove('selected'));$('why').classList.remove('show');if(save)history.push(x);ESCGameKit.audio.soft()}
function next(){if(!deck.length||pos>=deck.length-1)build();pos++;show(deck[pos]);$('deckInfo').textContent=Math.max(0,deck.length-pos-1)+' left'}function choose(id){document.querySelectorAll('.choice').forEach(b=>b.classList.toggle('selected',b.id===id));$('why').classList.add('show');ESCGameKit.audio.select()}
$('choiceA').onclick=()=>choose('choiceA');$('choiceB').onclick=()=>choose('choiceB');$('next').onclick=next;$('back').onclick=()=>{if(history.length<2)return;history.pop();show(history[history.length-1],false)};$('shuffle').onclick=()=>{build();next();ESCGameKit.toast('New surprise deck')};
cats.forEach(c=>{const b=document.createElement('button');b.className='game-chip'+(c==='All'?' active':'');b.textContent=c;b.onclick=()=>{selected=c;document.querySelectorAll('.game-chip').forEach(x=>x.classList.toggle('active',x===b));build();next()};$('chips').appendChild(b)});document.addEventListener('keydown',e=>{if(e.key.toLowerCase()==='a')choose('choiceA');else if(e.key.toLowerCase()==='b')choose('choiceB');else if(e.code==='Space'){e.preventDefault();next()}});build();next();
</script><script src="../esc-depth-pass.js?v=20260916-1720"></script><script src="/game-content-v2.js?v=20260922-1"></script>
