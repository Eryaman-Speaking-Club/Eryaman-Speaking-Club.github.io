<!doctype html>
<html lang="tr">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <meta name="robots" content="noindex">
  <title>Sayfa bulunamadı · Eryaman Speaking Club</title>
  <link rel="icon" href="/favicon.png">
  <style>
    :root{--navy:#081f3b;--blue:#175ca8;--teal:#16a6a2;--coral:#f05f69}
    *{box-sizing:border-box}body{margin:0;min-height:100vh;display:grid;place-items:center;background:radial-gradient(circle at 15% 15%,rgba(22,166,162,.14),transparent 30%),linear-gradient(180deg,#fff,#f4f8fb);font-family:Inter,system-ui,sans-serif;color:var(--navy);padding:24px}
    main{width:min(760px,100%);padding:54px;border:1px solid #dce5ed;border-radius:34px;background:#fff;box-shadow:0 28px 80px rgba(8,31,59,.12);text-align:center}
    .mark{width:84px;height:84px;border-radius:26px;margin:0 auto 24px;background:var(--navy);display:grid;place-items:center;color:#fff;font-size:34px;font-weight:900}
    small{color:var(--teal);font-weight:900;letter-spacing:.12em}h1{font-size:clamp(44px,8vw,76px);line-height:.95;letter-spacing:-.05em;margin:14px 0}p{color:#6f8193;line-height:1.65;max-width:520px;margin:0 auto 28px}
    a{display:inline-flex;min-height:54px;align-items:center;padding:0 22px;border-radius:16px;background:var(--navy);color:#fff;text-decoration:none;font-weight:900}
  </style>
  <script id="custom-page-route">
    (() => {
      const match = location.pathname.match(/^\/page\/([a-z0-9-]+)\/?$/i);
      if (!match) return;
      const params = new URLSearchParams(location.search);
      params.set('slug', match[1]);
      location.replace('/page.html?' + params.toString() + location.hash);
    })();
  </script>
</head>
<body><main><div class="mark"><img src="/esc-center-symbol.webp" alt="" style="width:100%;height:100%;object-fit:cover;border-radius:26px"></div><small>404 · SAYFA BULUNAMADI</small><h1>Yanlış masaya geldin.</h1><p>Aradığın sayfa taşınmış veya artık burada olmayabilir. Ana sayfaya dönüp sıradaki buluşmayı görebilirsin.</p><a href="/">Ana sayfaya dön →</a></main></body>
</html>
