<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#0b2f5b">
  <title>Eryaman Speaking Club Games</title>
  <style>
    *{box-sizing:border-box}
    body{
      margin:0;min-height:100vh;display:grid;place-items:center;
      font-family:Inter,system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;
      background:linear-gradient(#fff,#f4f7fa);color:#0b2f5b
    }
    .wrap{width:min(760px,92vw);text-align:center}
    .logo{width:min(430px,84vw);height:auto;margin-bottom:30px}
    .grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:18px}
    .card{
      display:block;text-decoration:none;border:1px solid #dce5ed;border-radius:22px;
      padding:30px 22px;background:#fff;color:#0b2f5b;
      box-shadow:0 18px 50px rgba(11,47,91,.12);
      font-weight:900;font-size:24px
    }
    .card span{display:block;margin-top:8px;color:#6f8193;font-size:14px;font-weight:600}
    .card.dare{border-top:6px solid #f74f54}
    .card.me{border-top:6px solid #0b2f5b}
    @media(max-width:650px){
      .grid{grid-template-columns:1fr}
      .logo{width:min(370px,90vw)}
    }
  </style>
</head>
<body>
  <main class="wrap">
    <img class="logo" src="./51a64254-0651-4c02-8235-bef5325d7947%20(1).png" alt="Eryaman Speaking Club">
    <div class="grid">
      <a class="card dare" href="./truth-or-dare/">
        Truth or Dare
        <span>Player wheel + Truth / Dare game</span>
      </a>
      <a class="card me" href="./one-for-me-one-for-you/">
        One for Me · One for You
        <span>Conversation question game</span>
      </a>
    </div>
  </main>
</body>
</html>
