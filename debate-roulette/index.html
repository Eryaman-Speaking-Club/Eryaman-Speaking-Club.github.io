</style></head><body><div class="game-shell"><header class="game-topbar"><a class="esc-brand" href="../"><span class="esc-brand-mark"><img src="../esc-center-symbol.webp" alt=""></span><span class="esc-brand-title">Eryaman Speaking Club</span></a><div class="game-actions"><button class="game-icon-btn" data-esc-sound aria-label="Sound">🔊</button></div></header><section class="game-hero"><span class="game-eyebrow">🎙️ Take a Side</span><h1>Debate Roulette</h1><p>You do not choose your opinion. The game does. Defend FOR or AGAINST, even if you disagree.</p></section><nav class="game-chips" id="chips"></nav><main class="game-panel"><div class="game-meta"><span id="deckInfo">Ready</span><span id="catInfo">All categories</span></div><section class="game-card"><div class="game-card-inner debate-card"><span class="game-badge" id="badge">Everyday</span><div class="motion" id="motion"></div><div class="side" id="side">SPIN A SIDE</div><div class="debate-timer" id="timer">45</div><div class="prep" id="phase">45-second speaking round</div></div></section><div class="debate-actions"><button class="game-primary" id="spin">🎲 Pick my side</button><button class="game-success" id="start">Start 45s</button><button class="game-secondary" id="next">Next motion</button></div><div class="game-note">You get 10 seconds to think. Then speak for 45 seconds without switching sides.</div></main></div><script src="../esc-game-kit.js?v=20260916-0802"></script><script>

['Fun','Pineapple belongs on pizza.'],['Fun','Cats are better pets than dogs.'],['Fun','Summer is better than winter.'],['Fun','Movies are better at home than in the cinema.'],['Fun','Being able to fly is better than being invisible.'],['Fun','Karaoke is fun, not embarrassing.'],['Fun','Coffee is better than tea.'],['Fun','Memes are a valid form of communication.'],['Fun','A zombie apocalypse would be exciting.'],['Fun','Birthdays are overrated.'],
['Social','Social media has improved friendships.'],['Social','It is okay to cancel plans because you are tired.'],['Social','Friends should always tell each other the full truth.'],['Social','People should stay friends with their exes.'],['Social','Group chats make friendships stronger.'],['Social','First impressions are usually accurate.'],['Social','Ghosting is sometimes acceptable.'],['Social','You can be close friends with someone who has opposite values.'],['Social','Online friendships can be as real as offline friendships.'],['Social','People should split the bill on a first date.'],
['Deep','Money can buy happiness.'],['Deep','Success matters more than work-life balance.'],['Deep','People can completely change their personality.'],['Deep','Regret is useful.'],['Deep','It is better to know an uncomfortable truth than a comfortable lie.'],['Deep','Talent matters more than discipline.'],['Deep','Privacy is more important than convenience.'],['Deep','People are happier when they have fewer choices.'],['Deep','Failure teaches more than success.'],['Deep','A peaceful life is better than an ambitious life.'],

const cats=['All','Everyday','Fun','Social','Deep','Spicy'];let selected='All',deck=[],pos=-1,time=45,t=null,running=false;const $=id=>document.getElementById(id),shuffle=a=>{a=[...a];for(let i=a.length-1;i>0;i--){let j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]]}return a};function build(){deck=shuffle(motions.filter(x=>selected==='All'||x[0]===selected));pos=-1;$('catInfo').textContent=selected==='All'?'All categories':selected}function stop(){running=false;clearInterval(t);t=null;$('timer').textContent=45;$('phase').textContent='45-second speaking round'}function show(){stop();if(!deck.length||pos>=deck.length-1)build();const x=deck[++pos];$('badge').textContent=x[0];$('motion').textContent=x[1];$('side').textContent='SPIN A SIDE';$('side').className='side';$('deckInfo').textContent=Math.max(0,deck.length-pos-1)+' left';ESCGameKit.audio.soft()}function pick(){const s=Math.random()<.5?'FOR':'AGAINST';$('side').textContent=s;$('side').className='side '+(s==='FOR'?'for':'against');ESCGameKit.audio.select()}function start(){if(running)return;running=true;time=45;$('timer').textContent=time;$('phase').textContent='Speak now';ESCGameKit.audio.success();t=setInterval(()=>{time--;$('timer').textContent=time;if(time<=5&&time>0)ESCGameKit.audio.count(time);if(time<=0){clearInterval(t);t=null;running=false;$('phase').textContent='Time!';ESCGameKit.audio.timeup()}},1000)}
$('spin').onclick=pick;$('start').onclick=start;$('next').onclick=show;cats.forEach(c=>{const b=document.createElement('button');b.className='game-chip'+(c==='All'?' active':'');b.textContent=c;b.onclick=()=>{selected=c;document.querySelectorAll('.game-chip').forEach(x=>x.classList.toggle('active',x===b));build();show()};$('chips').appendChild(b)});build();show();
