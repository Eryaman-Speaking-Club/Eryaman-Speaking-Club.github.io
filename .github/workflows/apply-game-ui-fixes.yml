name: Apply game UI fixes

on:
  push:
    paths:
      - '.github/workflows/apply-game-ui-fixes.yml'

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
      - name: Apply fixes
        shell: bash
        run: python3 -c "import base64;exec(base64.b64decode(''))"
      - name: Commit changes
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add sound-control.js truth-or-dare/app.js truth-or-dare/index.html one-for-me-one-for-you/index.html
          git diff --cached --quiet && exit 0
          git commit -m "Refine wheel layout and unify volume controls"
          git push
