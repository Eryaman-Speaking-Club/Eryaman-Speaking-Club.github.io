name: Language switch regression
on:
  push:
    branches: [main, fix/tr-en-responsiveness]
    paths:
      - 'language-switcher.js'
      - 'index.html'
      - 'home*.css'
      - 'tests/language_switch.py'
      - '.github/workflows/language-regression.yml'
  pull_request:
    paths:
      - 'language-switcher.js'
      - 'index.html'
      - 'home*.css'
      - 'tests/language_switch.py'
      - '.github/workflows/language-regression.yml'
  workflow_run:
    workflows: ['Deploy to GitHub Pages']
    types: [completed]
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: language-regression-${{ github.event_name }}-${{ github.ref }}
  cancel-in-progress: true
jobs:
  browsers:
    if: github.event_name != 'workflow_run' || github.event.workflow_run.conclusion == 'success'
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event_name == 'workflow_run' && github.event.workflow_run.head_sha || github.sha }}
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install browser test dependencies
        run: |
          python -m pip install playwright==1.57.0
          python -m playwright install --with-deps chromium webkit
      - name: Test repository language switching
        if: github.event_name != 'workflow_run'
        run: timeout 240s python -u tests/language_switch.py
      - name: Test published GitHub Pages site
        if: github.event_name == 'workflow_run'
        env:
          TEST_BASE_URL: https://eryaman-speaking-club.github.io/
        run: timeout 240s python -u tests/language_switch.py
      - name: Keep performance measurements and screenshots
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: language-regression-${{ github.event_name }}-${{ github.sha }}
          path: test-results
          retention-days: 7
