name: Apply brand header

on:
  push:
    paths:
      - ".github/workflows/apply-brand-header.yml"

permissions:
  contents: write

jobs:
  update-brand:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Match the new games to the existing ESC header
        run: |
          python - <<'PY'
          from pathlib import Path

          files = [
              Path('last-thing-you-did/index.html'),
              Path('what-would-you-do-if/index.html'),
          ]

          old_html = '<a class="brand" href="../"><img src="../esc-center-symbol.webp" alt="ESC"><span>Eryaman Speaking Club</span></a>'
          new_html = '<a class="brand" href="../"><img src="../51a64254-0651-4c02-8235-bef5325d7947%20(1).png" alt="Eryaman Speaking Club"></a>'

          old_css_a = '.brand{display:flex;align-items:center;gap:12px;text-decoration:none;color:var(--navy);font-weight:950;letter-spacing:-.02em}\n    .brand img{width:54px;height:54px;object-fit:contain;border-radius:16px;background:#fff;box-shadow:0 8px 24px rgba(11,47,91,.12)}'
          old_css_b = '.brand{display:flex;align-items:center;gap:12px;text-decoration:none;color:var(--navy);font-weight:950;letter-spacing:-.02em}.brand img{width:54px;height:54px;object-fit:contain;border-radius:16px;background:#fff;box-shadow:0 8px 24px rgba(11,47,91,.12)}'
          new_css = '.brand{display:flex;align-items:center;text-decoration:none;min-width:0}\n    .brand img{width:340px;height:124px;display:block;object-fit:contain;object-position:left center;max-width:min(62vw,340px)}'

          old_mobile_a = '.shell{padding-top:14px}.brand span{display:none}.brand img{width:46px;height:46px}.icon-btn{width:44px;height:44px}'
          new_mobile_a = '.shell{padding-top:14px}.brand img{width:270px;height:98px;max-width:72vw}.icon-btn{width:44px;height:44px;flex:0 0 44px}'

          for path in files:
              text = path.read_text(encoding='utf-8')
              if old_html not in text:
                  raise SystemExit(f'brand markup not found in {path}')
              text = text.replace(old_html, new_html, 1)
              if old_css_a in text:
                  text = text.replace(old_css_a, new_css, 1)
              elif old_css_b in text:
                  text = text.replace(old_css_b, new_css.replace('\n    ', ''), 1)
              else:
                  raise SystemExit(f'brand css not found in {path}')
              if old_mobile_a not in text:
                  raise SystemExit(f'mobile brand css not found in {path}')
              text = text.replace(old_mobile_a, new_mobile_a, 1)
              path.write_text(text, encoding='utf-8')
          PY
      - name: Commit brand header update
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add last-thing-you-did/index.html what-would-you-do-if/index.html
          git commit -m "Use full ESC header logo in new games" || exit 0
          git push
