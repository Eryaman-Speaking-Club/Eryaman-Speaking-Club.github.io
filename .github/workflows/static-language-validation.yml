name: Static language validation
on:
  push:
    branches: [fix/static-language-validation]
    paths:
      - 'tests/static_language_navigation.py'
      - '.github/workflows/static-language-validation.yml'
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: static-language-validation-${{ github.ref }}
  cancel-in-progress: true
jobs:
  live:
    runs-on: ubuntu-latest
    timeout-minutes: 6
    strategy:
      fail-fast: false
      matrix:
        include:
          - engine: chromium
            mobile: 'false'
          - engine: webkit
            mobile: 'false'
          - engine: webkit
            mobile: 'true'
    env:
      ENGINE: ${{ matrix.engine }}
      MOBILE: ${{ matrix.mobile }}
      TEST_BASE_URL: https://eryaman-speaking-club.github.io/
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install browser
        run: |
          python -m pip install playwright==1.57.0
          python -m playwright install --with-deps "${ENGINE}"
      - name: Test actual published language links
        run: timeout 150s python -u tests/static_language_navigation.py
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: static-language-${{ matrix.engine }}-${{ matrix.mobile }}
          path: test-results
          retention-days: 7
