name: Deploy to GitHub Pages
on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  validate-games:
    name: Validate CEFR and 32 speaking games
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Build reviewed CEFR games
        run: python3 tools/cefr_build.py
      - name: Validate every game-level bank
        run: node tests/cefr-check.cjs
      - name: Validate Game Master and all 32 game routes
        run: node tests/esc-ui-smoke.cjs

  deploy:
    name: Publish static website independently
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Confirm private lesson guide and linked pages exist
        shell: bash
        run: |
          test -f index.html
          test -f CNAME
          test -f .nojekyll
          test -f ozel-dersler/index.html
          test -f ozel-dersler/ogrenme-rehberi/index.html
          test -f ozel-dersler/ogrenme-rehberi.html
          grep -Eq 'href="/ozel-dersler/ogrenme-rehberi(/|[.]html)"' ozel-dersler/index.html
          grep -q '<main class="guide-paper">' ozel-dersler/ogrenme-rehberi.html
          grep -q '<main class="guide-paper">' ozel-dersler/ogrenme-rehberi/index.html
      - name: Configure Pages
        uses: actions/configure-pages@v5
      - name: Upload static site
        uses: actions/upload-pages-artifact@v3
        with:
          path: .
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
