name: Cold language control
on:
  push:
    branches: [fix/tr-en-responsiveness]
    paths:
      - 'tests/language_control.py'
      - '.github/workflows/language-control.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  controls:
    runs-on: ubuntu-latest
    timeout-minutes: 6
    strategy:
      fail-fast: false
      matrix:
        variant: [baseline, fixed]
        first: [tr, en]
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install WebKit control dependencies
        run: |
          python -m pip install playwright==1.57.0
          python -m playwright install --with-deps webkit
      - name: Compare no-op and first language change
        env:
          VARIANT: ${{ matrix.variant }}
          FIRST: ${{ matrix.first }}
        run: timeout 90s python -u tests/language_control.py
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: language-control-${{ matrix.variant }}-${{ matrix.first }}
          path: test-results
          retention-days: 7
