name: Apply gameplay depth pass

on:
  push:
    paths:
      - ".github/workflows/apply-depth-pass.yml"

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Add shared gameplay enhancements
        run: |
          python - <<'PY'
          from pathlib import Path
          import re

          paths = [
              Path('would-you-rather/index.html'),
              Path('most-likely-to/index.html'),
              Path('five-second-challenge/index.html'),
              Path('red-flag-green-flag/index.html'),
              Path('debate-roulette/index.html'),
              Path('never-have-i-ever/index.html'),
          ]
          version = '20260916-1720'
          tag = f'<script src="../esc-depth-pass.js?v={version}"></script>'

          for path in paths:
              text = path.read_text(encoding='utf-8')
              text = re.sub(r'<script src="\.\./esc-depth-pass\.js(?:\?v=[^"]+)?"></script>', tag, text)
              if 'esc-depth-pass.js' not in text:
                  marker = '<script src="../esc-content-editor.js'
                  idx = text.find(marker)
                  if idx >= 0:
                      text = text[:idx] + tag + text[idx:]
                  else:
                      text = text.replace('</body>', tag + '</body>', 1)
              path.write_text(text, encoding='utf-8')
          PY
      - name: Commit gameplay depth pass
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add would-you-rather/index.html most-likely-to/index.html five-second-challenge/index.html red-flag-green-flag/index.html debate-roulette/index.html never-have-i-ever/index.html
          git commit -m "Add lightweight gameplay depth across ESC games" || exit 0
          git push
