name: Apply unified game brand

on:
  push:
    paths:
      - ".github/workflows/apply-unified-game-brand.yml"

permissions:
  contents: write

jobs:
  update-brand:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Apply integrated ESC header to all games
        run: |
          python - <<'PY'
          from pathlib import Path

          css_link = '  <link rel="stylesheet" href="../esc-brand.css">\n'

          configs = {
              Path('truth-or-dare/index.html'): (
                  '''      <button id="homeLogo" class="logo-button" aria-label="Restart game">\n        <img src="../51a64254-0651-4c02-8235-bef5325d7947%20(1).png" alt="Eryaman Speaking Club">\n      </button>''',
                  '''      <button id="homeLogo" class="logo-button esc-brand" aria-label="Restart game">\n        <span class="esc-brand-mark"><img src="../esc-center-symbol.webp" alt=""></span>\n        <span class="esc-brand-title">Eryaman Speaking Club</span>\n      </button>'''
              ),
              Path('one-for-me-one-for-you/index.html'): (
                  '''      <button id="homeLogo" class="logo-button" aria-label="Go to home">\n        <img src="../51a64254-0651-4c02-8235-bef5325d7947%20(1).png" alt="Eryaman Speaking Club">\n      </button>''',
                  '''      <button id="homeLogo" class="logo-button esc-brand" aria-label="Go to home">\n        <span class="esc-brand-mark"><img src="../esc-center-symbol.webp" alt=""></span>\n        <span class="esc-brand-title">Eryaman Speaking Club</span>\n      </button>'''
              ),
              Path('last-thing-you-did/index.html'): (
                  '<a class="brand" href="../"><img src="../51a64254-0651-4c02-8235-bef5325d7947%20(1).png" alt="Eryaman Speaking Club"></a>',
                  '<a class="brand esc-brand" href="../"><span class="esc-brand-mark"><img src="../esc-center-symbol.webp" alt=""></span><span class="esc-brand-title">Eryaman Speaking Club</span></a>'
              ),
              Path('what-would-you-do-if/index.html'): (
                  '<a class="brand" href="../"><img src="../51a64254-0651-4c02-8235-bef5325d7947%20(1).png" alt="Eryaman Speaking Club"></a>',
                  '<a class="brand esc-brand" href="../"><span class="esc-brand-mark"><img src="../esc-center-symbol.webp" alt=""></span><span class="esc-brand-title">Eryaman Speaking Club</span></a>'
              ),
          }

          for path, (old, new) in configs.items():
              text = path.read_text(encoding='utf-8')
              if '../esc-brand.css' not in text:
                  if path.name == 'index.html' and path.parent.name in ('truth-or-dare','one-for-me-one-for-you'):
                      marker = '  <link rel="stylesheet" href="./styles.css">\n'
                      if marker not in text:
                          raise SystemExit(f'styles marker not found in {path}')
                      text = text.replace(marker, marker + css_link, 1)
                  else:
                      marker = '</style>\n</head>'
                      if marker not in text:
                          raise SystemExit(f'head style marker not found in {path}')
                      text = text.replace(marker, '</style>\n' + css_link + '</head>', 1)
              if old not in text:
                  if 'esc-brand-title' not in text:
                      raise SystemExit(f'brand markup not found in {path}')
              else:
                  text = text.replace(old, new, 1)
              path.write_text(text, encoding='utf-8')
          PY
      - name: Commit unified header
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add truth-or-dare/index.html one-for-me-one-for-you/index.html last-thing-you-did/index.html what-would-you-do-if/index.html
          git commit -m "Use integrated ESC header across all games" || exit 0
          git push
