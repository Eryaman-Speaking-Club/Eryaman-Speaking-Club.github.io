name: Split ESC games

on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/split-games.yml"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  split:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Separate Truth or Dare and One for Me One for You
        shell: bash
        run: |
          set -euo pipefail

          rm -rf truth-or-dare one-for-me-one-for-you
          mkdir -p truth-or-dare one-for-me-one-for-you

          # 1) Keep the CURRENT game as Truth or Dare
          cp index.html truth-or-dare/index.html
          cp styles.css truth-or-dare/styles.css
          cp app.js truth-or-dare/app.js
          cp questions.js truth-or-dare/questions.js
          if [ -f logo-size.css ]; then
            cp logo-size.css truth-or-dare/logo-size.css
          fi

          # 2) Restore the last correct One for Me / One for You version
          OLD_COMMIT="f824bfd379f2e63de5aa14b7cb4057960bf7160f"

          git show "$OLD_COMMIT:index.html" > one-for-me-one-for-you/index.html
          git show "$OLD_COMMIT:styles.css" > one-for-me-one-for-you/styles.css
          git show "$OLD_COMMIT:app.js" > one-for-me-one-for-you/app.js
          git show "$OLD_COMMIT:questions.js" > one-for-me-one-for-you/questions.js

          if git cat-file -e "$OLD_COMMIT:logo-size.css" 2>/dev/null; then
            git show "$OLD_COMMIT:logo-size.css" > one-for-me-one-for-you/logo-size.css
          fi

          # 3) Both games use the logo stored in the repository root.
          python3 - <<'PY'
          from pathlib import Path

          for folder in ("truth-or-dare", "one-for-me-one-for-you"):
              p = Path(folder) / "index.html"
              text = p.read_text(encoding="utf-8")
              text = text.replace(
                  "./51a64254-0651-4c02-8235-bef5325d7947%20(1).png",
                  "../51a64254-0651-4c02-8235-bef5325d7947%20(1).png",
              )
              text = text.replace(
                  "./51a64254-0651-4c02-8235-bef5325d7947 (1).png",
                  "../51a64254-0651-4c02-8235-bef5325d7947%20(1).png",
              )
              p.write_text(text, encoding="utf-8")
          PY

          # 4) Root page becomes a launcher for the two separate games
          cat > index.html <<'HTML'
          <!doctype html>
          <html lang="en">
          <head>
            <meta charset="UTF-8">
            <meta name="viewport" content="width=device-width, initial-scale=1">
            <meta name="theme-color" content="#0b2f5b">
            <title>Eryaman Speaking Club Games</title>
            <style>
              *{box-sizing:border-box}
              body{
                margin:0;min-height:100vh;display:grid;place-items:center;
                font-family:Inter,system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;
                background:linear-gradient(#fff,#f4f7fa);color:#0b2f5b
              }
              .wrap{width:min(760px,92vw);text-align:center}
              .logo{width:min(430px,84vw);height:auto;margin-bottom:30px}
              .grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:18px}
              .card{
                display:block;text-decoration:none;border:1px solid #dce5ed;border-radius:22px;
                padding:30px 22px;background:#fff;color:#0b2f5b;
                box-shadow:0 18px 50px rgba(11,47,91,.12);
                font-weight:900;font-size:24px
              }
              .card span{display:block;margin-top:8px;color:#6f8193;font-size:14px;font-weight:600}
              .card.dare{border-top:6px solid #f74f54}
              .card.me{border-top:6px solid #0b2f5b}
              @media(max-width:650px){
                .grid{grid-template-columns:1fr}
                .logo{width:min(370px,90vw)}
              }
            </style>
          </head>
          <body>
            <main class="wrap">
              <img class="logo" src="./51a64254-0651-4c02-8235-bef5325d7947%20(1).png" alt="Eryaman Speaking Club">
              <div class="grid">
                <a class="card dare" href="./truth-or-dare/">
                  Truth or Dare
                  <span>Player wheel + Truth / Dare game</span>
                </a>
                <a class="card me" href="./one-for-me-one-for-you/">
                  One for Me · One for You
                  <span>Conversation question game</span>
                </a>
              </div>
            </main>
          </body>
          </html>
          HTML

      - name: Commit generated game folders
        run: |
          git config user.name "Eryaman Speaking Club"
          git config user.email "idris.danismaz@birsenkimya.com"

          git add index.html truth-or-dare one-for-me-one-for-you

          if git diff --cached --quiet; then
            echo "Nothing to commit."
            exit 0
          fi

          git commit -m "Separate Truth or Dare and One for Me One for You"
          git push
