name: Bust ESC brand cache

on:
  push:
    paths:
      - ".github/workflows/bust-brand-cache.yml"

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Add cache version to shared brand stylesheet
        run: |
          python - <<'PY'
          from pathlib import Path
          files = [
              Path('index.html'),
              Path('truth-or-dare/index.html'),
              Path('one-for-me-one-for-you/index.html'),
              Path('last-thing-you-did/index.html'),
              Path('what-would-you-do-if/index.html'),
          ]
          for p in files:
              text = p.read_text(encoding='utf-8')
              text = text.replace('esc-brand.css?v=20260915-2240', 'esc-brand.css?v=20260915-2241')
              text = text.replace('esc-brand.css"', 'esc-brand.css?v=20260915-2241"')
              p.write_text(text, encoding='utf-8')
          PY
      - name: Commit cache bust
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html truth-or-dare/index.html one-for-me-one-for-you/index.html last-thing-you-did/index.html what-would-you-do-if/index.html
          git commit -m "Force fresh shared brand CSS on all game pages" || exit 0
          git push
