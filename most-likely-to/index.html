<!doctype html><html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#0b2f5b"><title>Most Likely To · Eryaman Speaking Club</title><link rel="stylesheet" href="../esc-brand.css?v=20260916-0802"><link rel="stylesheet" href="../esc-game-kit.css?v=20260916-0802"><style>
.mlt-card{min-height:390px;display:flex;flex-direction:column;justify-content:center;text-align:center}.mlt-lead{color:var(--coral);font-size:clamp(18px,2.7vw,24px);font-weight:950;text-transform:uppercase;letter-spacing:.04em;margin-bottom:10px}.mlt-prompt{font-size:clamp(34px,6vw,62px);margin:0 auto;max-width:720px}.vote-box{margin-top:22px;min-height:72px;display:grid;place-items:center}.count-number{font-size:58px;line-height:1;font-weight:1000;color:var(--orange);display:none}.count-number.show{display:block;animation:pop .35s ease}@keyframes pop{0%{transform:scale(.6);opacity:.2}100%{transform:scale(1);opacity:1}}.point-now{display:none;font-size:24px;font-weight:950;color:var(--navy)}.point-now.show{display:block}.vote-btn{min-width:210px}@media(max-width:680px){.mlt-card{min-height:350px}.mlt-prompt{font-size:clamp(30px,9vw,46px)}}
</style></head><body><div class="game-shell"><header class="game-topbar"><a class="esc-brand" href="../"><span class="esc-brand-mark"><img src="../esc-center-symbol.webp" alt=""></span><span class="esc-brand-title">Eryaman Speaking Club</span></a><div class="game-actions"><button class="game-icon-btn" data-esc-sound aria-label="Sound">🔊</button></div></header><section class="game-hero"><span class="game-eyebrow">👀 Group Vote</span><h1>Most Likely To</h1><p>Read the prompt. On three, everyone points at one person. The chosen person gets to defend themselves.</p></section><nav class="game-chips" id="chips"></nav>
<main class="game-panel"><div class="game-meta"><span id="deckInfo">Ready</span><span id="catInfo">All categories</span></div><section class="game-card"><div class="game-card-inner mlt-card"><span class="game-badge" id="badge">Funny</span><div class="mlt-lead">Who is most likely to...</div><div class="game-prompt mlt-prompt" id="prompt"></div><div class="vote-box"><button class="game-primary vote-btn" id="vote">Vote in 3... 2... 1...</button><div class="count-number" id="count"></div><div class="point-now" id="point">👉 POINT NOW!</div></div></div></section><div class="game-controls"><button class="game-secondary" id="back">↩ Previous</button><button class="game-primary" id="next">Next prompt →</button><button class="game-secondary" id="shuffle">↻ Shuffle</button></div><div class="game-note">Everyone must point at exactly one person.</div></main></div><script src="../esc-game-kit.js?v=20260916-0802"></script><script>
const items=[
['Funny','become a meme by accident?'],['Funny','laugh at the worst possible moment?'],['Funny','get lost in their own neighbourhood?'],['Funny','send a message to the wrong person?'],['Funny','survive on snacks for an entire week?'],['Funny','fall asleep during a movie they chose?'],['Funny','become famous for something ridiculous?'],['Funny','start dancing first at a wedding?'],['Funny','own the weirdest pet?'],['Funny','forget why they walked into a room?'],['Funny','talk to a stranger for 20 minutes?'],['Funny','accidentally wear two different socks to work?'],
['Chaos','survive a zombie apocalypse?'],['Chaos','become the leader during an emergency?'],['Chaos','press a mysterious red button?'],['Chaos','join a reality show?'],['Chaos','move abroad with one week’s notice?'],['Chaos','quit their job with no backup plan?'],['Chaos','get arrested for something stupid?'],['Chaos','become a conspiracy theorist for one day?'],['Chaos','try an extreme sport without training?'],['Chaos','accept a suitcase from a stranger?'],['Chaos','go viral overnight?'],['Chaos','start a business at 3 a.m. after one idea?'],
['Social','remember everyone’s birthday?'],['Social','cancel plans at the last minute?'],['Social','be the first to apologise after an argument?'],['Social','keep a secret for ten years?'],['Social','make friends in a completely new city?'],['Social','reply “on my way” while still at home?'],['Social','organise the entire group trip?'],['Social','disappear from the group chat for a week?'],['Social','know all the gossip first?'],['Social','introduce two people who later get married?'],['Social','give the best relationship advice?'],['Social','overthink a two-word text message?'],
['Future','become a millionaire?'],['Future','live in another country?'],['Future','write a book?'],['Future','start a successful company?'],['Future','retire early?'],['Future','become a teacher or mentor?'],['Future','buy a house first?'],['Future','learn five languages?'],['Future','change careers completely?'],['Future','become locally famous?'],['Future','travel to 50 countries?'],['Future','still organise meetups when everyone is 60?'],
['Spicy','text an ex after midnight?'],['Spicy','fall in love first?'],['Spicy','have a secret crush in the group?'],['Spicy','go on three dates in one week?'],['Spicy','ghost someone and regret it?'],['Spicy','flirt without realising it?'],['Spicy','date someone completely opposite to them?'],['Spicy','make the first move?'],['Spicy','get jealous but pretend not to care?'],['Spicy','marry someone they met unexpectedly?'],['Spicy','send a risky message and delete it?'],['Spicy','have the most chaotic dating story?']];
const cats=['All','Funny','Chaos','Social','Future','Spicy'];let selected='All',deck=[],pos=-1,history=[],counting=false,voteToken=0;const $=id=>document.getElementById(id),shuffle=a=>{a=[...a];for(let i=a.length-1;i>0;i--){let j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]]}return a};
function build(){deck=shuffle(items.filter(x=>selected==='All'||x[0]===selected));pos=-1;$('catInfo').textContent=selected==='All'?'All categories':selected}function resetVote(){voteToken++;counting=false;$('vote').style.display='inline-flex';$('count').classList.remove('show');$('point').classList.remove('show')}function show(x,save=true){$('badge').textContent=x[0];$('prompt').textContent=x[1];resetVote();if(save)history.push(x);ESCGameKit.audio.soft()}function next(){if(!deck.length||pos>=deck.length-1)build();show(deck[++pos]);$('deckInfo').textContent=Math.max(0,deck.length-pos-1)+' left'}
$('vote').onclick=async()=>{if(counting)return;counting=true;const token=++voteToken;$('vote').style.display='none';for(const n of [3,2,1]){if(token!==voteToken)return;$('count').textContent=n;$('count').classList.add('show');ESCGameKit.audio.count(n);await new Promise(r=>setTimeout(r,650));if(token!==voteToken)return;$('count').classList.remove('show');await new Promise(r=>setTimeout(r,80))}if(token!==voteToken)return;$('point').classList.add('show');ESCGameKit.audio.success();counting=false};$('next').onclick=next;$('back').onclick=()=>{if(history.length<2)return;history.pop();show(history[history.length-1],false)};$('shuffle').onclick=()=>{build();next();ESCGameKit.toast('Deck shuffled')};cats.forEach(c=>{const b=document.createElement('button');b.className='game-chip'+(c==='All'?' active':'');b.textContent=c;b.onclick=()=>{selected=c;document.querySelectorAll('.game-chip').forEach(x=>x.classList.toggle('active',x===b));build();next()};$('chips').appendChild(b)});build();next();
</script></body></html>
