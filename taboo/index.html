<!doctype html><html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#0b2f5b"><title>Taboo · Eryaman Speaking Club</title><link rel="stylesheet" href="../esc-brand.css?v=20260916-0802"><link rel="stylesheet" href="../esc-game-kit.css?v=20260916-0802"><style>

</style></head><body><div class="game-shell"><header class="game-topbar"><a class="esc-brand" href="../"><span class="esc-brand-mark"><img src="../esc-center-symbol.webp" alt=""></span><span class="esc-brand-title">Eryaman Speaking Club</span></a><div class="game-actions"><button class="game-icon-btn" data-esc-sound aria-label="Sound">🔊</button></div></header><section class="game-hero"><span class="game-eyebrow">🗣️ Describe It</span><h1>Taboo</h1><p>Make your team guess the main word without saying any of the forbidden words. You have 60 seconds.</p></section><nav class="game-chips" id="chips"></nav><main class="game-panel"><div class="game-meta"><span id="deckInfo">Ready</span><span id="catInfo">All categories</span></div><section class="game-card"><div class="game-card-inner taboo-card"><span class="game-badge" id="badge">Everyday</span><div class="target" id="target"></div><div class="dont">Do not say</div><div class="forbidden" id="forbidden"></div><div class="timer" id="timer">60</div><div class="score" id="score">Score: 0 · Passes: 0</div></div></section><div class="taboo-actions"><button class="game-primary" id="start">Start 60s</button><button class="game-success" id="got">✓ Got it</button><button class="game-secondary" id="pass">Pass</button><button class="game-secondary" id="newRound">New round</button></div><div class="game-note">One speaker describes. Everyone else guesses. No spelling, translations or gestures.</div></main></div><script src="../esc-game-kit.js?v=20260916-0802"></script><script>
const cards=[
['Everyday','PHONE',['CALL','SCREEN','MESSAGE','APP']],['Everyday','UMBRELLA',['RAIN','WET','WEATHER','CARRY']],['Everyday','ELEVATOR',['FLOOR','UP','DOWN','BUILDING']],['Everyday','MIRROR',['FACE','LOOK','REFLECTION','GLASS']],['Everyday','PASSWORD',['LOGIN','SECRET','ACCOUNT','CODE']],['Everyday','TRAFFIC',['CAR','ROAD','JAM','DRIVE']],['Everyday','ALARM',['WAKE','MORNING','CLOCK','SLEEP']],['Everyday','WALLET',['MONEY','CARD','POCKET','CASH']],['Everyday','NEIGHBOUR',['HOME','NEXT','HOUSE','LIVE']],['Everyday','BATTERY',['PHONE','CHARGE','POWER','ENERGY']],
['Travel','AIRPORT',['PLANE','FLIGHT','PASSPORT','TRAVEL']],['Travel','HOTEL',['ROOM','STAY','RECEPTION','BED']],['Travel','SUITCASE',['BAG','CLOTHES','PACK','TRAVEL']],['Travel','PASSPORT',['COUNTRY','TRAVEL','ID','BORDER']],['Travel','BEACH',['SEA','SAND','SWIM','SUN']],['Travel','MAP',['DIRECTION','PLACE','ROAD','LOCATION']],['Travel','TOURIST',['VISIT','TRAVEL','FOREIGN','CAMERA']],['Travel','HOSTEL',['HOTEL','CHEAP','ROOM','TRAVEL']],['Travel','TICKET',['PAY','ENTRY','TRAIN','PLANE']],['Travel','JET LAG',['TIME','SLEEP','FLIGHT','TIRED']],
['Food','PIZZA',['CHEESE','ITALY','SLICE','DOUGH']],['Food','COFFEE',['DRINK','CAFFEINE','MORNING','CUP']],['Food','CHOCOLATE',['SWEET','COCOA','DESSERT','BROWN']],['Food','BURGER',['BREAD','MEAT','FAST FOOD','BUN']],['Food','SALAD',['VEGETABLE','HEALTHY','LETTUCE','GREEN']],['Food','BREAKFAST',['MORNING','EAT','EGG','MEAL']],['Food','SPICY',['HOT','CHILI','PEPPER','FOOD']],['Food','RECIPE',['COOK','INGREDIENT','FOOD','INSTRUCTION']],['Food','DESSERT',['SWEET','CAKE','AFTER','MEAL']],['Food','RESTAURANT',['MENU','WAITER','EAT','TABLE']],
['Work','MEETING',['OFFICE','TALK','TEAM','ZOOM']],['Work','DEADLINE',['TIME','FINISH','WORK','DATE']],['Work','BOSS',['MANAGER','WORK','OFFICE','LEADER']],['Work','EMAIL',['MESSAGE','SEND','INBOX','WORK']],['Work','SALARY',['MONEY','MONTH','JOB','PAY']],['Work','INTERVIEW',['JOB','QUESTION','HIRE','CV']],['Work','PROMOTION',['JOB','HIGHER','SALARY','POSITION']],['Work','COLLEAGUE',['WORK','OFFICE','PERSON','TEAM']],['Work','PRESENTATION',['SLIDE','SPEAK','AUDIENCE','POWERPOINT']],['Work','REMOTE',['HOME','WORK','ONLINE','OFFICE']],
['Entertainment','NETFLIX',['MOVIE','SERIES','WATCH','STREAM']],['Entertainment','CONCERT',['MUSIC','SINGER','LIVE','TICKET']],['Entertainment','KARAOKE',['SING','SONG','MICROPHONE','MUSIC']],['Entertainment','PODCAST',['LISTEN','AUDIO','EPISODE','VOICE']],['Entertainment','MEME',['FUNNY','INTERNET','IMAGE','JOKE']],['Entertainment','GAMING',['PLAY','VIDEO','CONSOLE','GAME']],['Entertainment','CINEMA',['MOVIE','SCREEN','TICKET','FILM']],['Entertainment','PLAYLIST',['MUSIC','SONG','SPOTIFY','LIST']],['Entertainment','SELFIE',['PHOTO','PHONE','FACE','CAMERA']],['Entertainment','VIRAL',['INTERNET','FAMOUS','VIDEO','TREND']]];
const cats=['All','Everyday','Travel','Food','Work','Entertainment'];let selected='All',deck=[],pos=-1,score=0,passes=0,time=60,t=null,running=false;const $=id=>document.getElementById(id),shuffle=a=>{a=[...a];for(let i=a.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]]}return a};function build(){deck=shuffle(cards.filter(x=>selected==='All'||x[0]===selected));pos=-1;$('catInfo').textContent=selected==='All'?'All categories':selected}function show(){if(!deck.length||pos>=deck.length-1)build();const x=deck[++pos];$('badge').textContent=x[0];$('target').textContent=x[1];$('forbidden').innerHTML=x[2].map(w=>'<span>'+w+'</span>').join('');$('deckInfo').textContent=Math.max(0,deck.length-pos-1)+' left'}function sync(){ $('timer').textContent=time;$('score').textContent='Score: '+score+' · Passes: '+passes }function stop(){running=false;clearInterval(t);t=null;$('start').textContent='Start 60s'}function start(){stop();time=60;score=0;passes=0;running=true;sync();$('start').textContent='Running…';ESCGameKit.audio.select();t=setInterval(()=>{time--;sync();if(time<=5&&time>0)ESCGameKit.audio.count(time);if(time<=0){stop();ESCGameKit.audio.timeup();ESCGameKit.toast('Time! Score: '+score)}},1000)}
$('start').onclick=start;$('got').onclick=()=>{if(!running)return;score++;sync();ESCGameKit.audio.success();show()};$('pass').onclick=()=>{if(!running)return;passes++;sync();ESCGameKit.audio.soft();show()};$('newRound').onclick=()=>{stop();time=60;score=0;passes=0;sync();build();show()};cats.forEach(c=>{const b=document.createElement('button');b.className='game-chip'+(c==='All'?' active':'');b.textContent=c;b.onclick=()=>{selected=c;document.querySelectorAll('.game-chip').forEach(x=>x.classList.toggle('active',x===b));stop();time=60;score=passes=0;sync();build();show()};$('chips').appendChild(b)});build();show();sync();
</script></body></html>
